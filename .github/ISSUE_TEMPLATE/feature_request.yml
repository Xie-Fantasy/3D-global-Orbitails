name: Feature request
description: Suggest an improvement for visualization or integration
title: "[Feature]: "
body:
  - type: textarea
    id: usecase
    attributes:
      label: What are you building?
      description: Explain the use case and the problem you want to solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an example or sketch if it helps.
    validations:
      required: true
